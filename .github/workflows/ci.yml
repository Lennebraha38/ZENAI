name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Python bagimliliklar
        run: pip install -r requirements.txt pytest
      - name: Derleme kontrolu (core + voice + scripts)
        run: python -m py_compile agentv2/zenai_zeka.py agentv2/akil_motoru.py agentv2/model_routing.py agentv2/self_correction.py agentv2/otomatik_skorer.py agentv2/cogunluk_oyu.py agentv2/meclis_hakemi.py agentv2/tam_zirve.py agentv2/guvenlik.py agentv2/bellek_vektor.py agentv2/soru_bankasi.py agentv2/dogrulama.py agentv2/dogrulama_seti.py agentv2/llm_provider.py agentv2/onbellek.py agentv2/araclar/*.py karsilastirma.py voice/server/modes.py voice/server/streamer.py scripts/olcum.py scripts/sync_konu_modelleri.py
      - name: JS syntax kontrolu (web + voice)
        run: node --check web/app.js && node --check web/api/voice.js && node --check web/api/chat.js
      - name: Konu modeli senkron kontrolu (python ↔ js)
        run: python scripts/sync_konu_modelleri.py --kontrol voice/server/modes.py voice/server/streamer.py scripts/olcum.py scripts/sync_konu_modelleri.py
      - name: JS syntax kontrolu (web api + app)
        run: node --check web/api/voice.js && node --check web/api/chat.js && node --check web/app.js
      - name: Konu modeli senkron kontrolu (python ↔ js)
        run: python scripts/sync_konu_modelleri.py --kontrol
      - name: Olcum kaniti gate (puansiz karsilastirma / latency yok = FAIL)
        run: python scripts/olcum_dogrula.py
      - name: Sifre/sifre sizintisi taramasi (build-time)
        run: |
          if git grep -nE "(sk-[A-Za-z0-9]{20,}|gsi_|ghp_|AKIA[0-9A-Z]{16}|sk-ant-[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,})" -- ':!*.json' ':!*.jsonl' ':!kayit/*' ':!node_modules' | grep -v "olcum_dogrula" ; then
            echo "Yukaridaki satirlar secret olabilir!"; exit 1
          fi
          echo "Secret taramasi temiz"
      - name: Test paketi (+ coverage)
        run: pip install pytest-cov && python -m pytest tests/ -q --cov=agentv2 --cov-report=term --cov-fail-under=40
      - name: Bagimlilik CVE taramasi (pip-audit)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt --fail-on=high
      - name: Node bagimlilik CVE taramasi (npm audit)
        continue-on-error: true
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high

  voice-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Voice bagimliliklari (gateway + pipecat cekirdegi)
        run: pip install -r voice/requirements.txt "pipecat-ai>=1.10" httpx pytest pytest-asyncio
      - name: Voice gateway + bot testleri
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agentv2
        run: python -m pytest voice/tests/test_streamer.py voice/tests/test_gateway.py voice/tests/test_bot.py -q
      - name: HUD durum makinesi testi (node)
        run: node voice/tests/test_hud.js
      - name: Yük testi (sahte LLM, eşzamanlı SSE)
        run: python scripts/yuk_testi.py --n 20 --eşzaman 10 --hiz_cap 20 --esik 3.0
